<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #ui-container {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(52, 73, 94, 0.9);
            padding: 15px;
            border-radius: 8px;
            color: white;
            z-index: 1000;
            min-width: 250px;
        }
        
        .control-group {
            margin-bottom: 10px;
        }
        
        .control-group label {
            display: inline-block;
            width: 100px;
            font-size: 14px;
        }
        
        .control-group input[type="number"] {
            width: 60px;
            padding: 4px;
            border: 1px solid #7f8c8d;
            border-radius: 4px;
        }
        
        .control-group input[type="checkbox"] {
            margin-right: 8px;
        }
        
        .control-group button {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            width: 100%;
        }
        
        .control-group button:hover {
            background: #2980b9;
        }
        
        .control-group button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }
        
        .legend {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #7f8c8d;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border: 1px solid #7f8c8d;
        }
        
        .info {
            margin-top: 10px;
            font-size: 12px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <h3 style="margin: 0 0 15px 0;">Level Generator</h3>
        
        <div class="control-group">
            <label for="width">Width:</label>
            <input type="number" id="width" min="10" max="100" value="30">
        </div>
        
        <div class="control-group">
            <label for="height">Height:</label>
            <input type="number" id="height" min="10" max="100" value="20">
        </div>
        
        <div class="control-group">
            <label for="regions">Regions:</label>
            <input type="number" id="regions" min="3" max="30" value="8">
        </div>
        
        <div class="control-group">
            <label for="distance">Min Distance:</label>
            <input type="number" id="distance" min="1" max="10" value="3">
        </div>
        
        <div class="control-group">
            <label for="culling">
                <input type="checkbox" id="culling" checked> Viewport Culling
            </label>
        </div>
        
        <div class="control-group">
            <button id="generate-btn">Generate Level</button>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: #90EE90;"></div>
                <span>Path</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #8B4513;"></div>
                <span>Region</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #F0F0F0;"></div>
                <span>Empty</span>
            </div>
        </div>
        
        <div class="info" id="info-text">
            Click 'Generate Level' to create a new layout
        </div>
    </div>

    <div id="game-container"></div>
</body>
</html>
