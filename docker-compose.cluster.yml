services:
  # Game Server 1
  procgen-server-1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    container_name: procgen-game-server-1
    restart: unless-stopped
    environment:
      - SERVER_ID=1
      - NODE_ENV=production
    networks:
      - procgen-cluster

  # Game Server 2
  procgen-server-2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    container_name: procgen-game-server-2
    restart: unless-stopped
    environment:
      - SERVER_ID=2
      - NODE_ENV=production
    networks:
      - procgen-cluster

  # Game Server 3
  procgen-server-3:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    container_name: procgen-game-server-3
    restart: unless-stopped
    environment:
      - SERVER_ID=3
      - NODE_ENV=production
    networks:
      - procgen-cluster

  # Load Balancer 
  nginx-loadbalancer:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/load-balancer.conf:/etc/nginx/nginx.conf
    depends_on:
      - procgen-server-1
      - procgen-server-2
      - procgen-server-3
    networks:
      - procgen-cluster
    profiles:
      - loadbalancer

networks:
  procgen-cluster:
    driver: bridge